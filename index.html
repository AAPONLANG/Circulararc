<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>阵列 · 中心聚焦（大幅曲线 · 顶角）</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body {
    height: 100%;
    overflow: hidden;
    background: #06080f;
    color: #e8eefc;
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI",
                 "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    -webkit-font-smoothing: antialiased;
  }

  #stage {
    position: fixed;
    inset: 0;
    overflow: hidden;
    cursor: grab;
    touch-action: none;
    background:
      radial-gradient(1000px 620px at 50% 33%, rgba(43, 78, 140, .38), transparent 70%),
      radial-gradient(720px 520px at 50% 100%, rgba(120, 70, 200, .20), transparent 70%),
      linear-gradient(180deg, #080b14 0%, #05070c 100%);
  }
  #stage.dragging { cursor: grabbing; }

  /* 中央聚光：定位到 1/3 处 */
  .spotlight {
    position: absolute;
    left: 50%; top: 33.33%;
    width: 850px; height: 850px;
    transform: translate(-50%, -50%);
    background: radial-gradient(circle,
      rgba(77, 157, 255, .16) 0%,
      rgba(77, 157, 255, .055) 38%,
      transparent 66%);
    pointer-events: none;
    z-index: 0;
  }

  /* 中央参考轴 */
  .axis {
    position: absolute;
    left: 50%; top: 33.33%;
    width: 1px; height: 450px;
    transform: translate(-50%, -50%);
    background: linear-gradient(180deg, transparent, rgba(140, 185, 255, .20), transparent);
    pointer-events: none;
    z-index: 1;
  }

  #wrap {
    position: absolute;
    inset: 0;
    transform-origin: 50% 33.33%; /* 缩放原点定在中心卡片位置 */
    animation: fadeIn .9s ease-out both;
  }
  @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

  /* ---------- 卡片 ---------- */
  .card {
    position: absolute;
    left: 50%; top: 33.33%; /* 初始位置定在 1/3 处 */
    width: 150px; height: 210px;
    border-radius: 22px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 12px;
    background: linear-gradient(160deg, rgba(255,255,255,.085), rgba(255,255,255,.018));
    border: 1px solid rgba(255,255,255,.09);
    box-shadow: 0 18px 44px -20px rgba(0,0,0,.95), inset 0 1px 0 rgba(255,255,255,.06);
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
    will-change: transform, opacity, filter;
    transition: background .38s ease, border-color .38s ease, box-shadow .38s ease;
    user-select: none;
    cursor: pointer;
    transform: translate(-50%, -50%);
  }

  .card .num {
    font-size: 44px;
    font-weight: 700;
    line-height: 1;
    font-variant-numeric: tabular-nums;
    letter-spacing: .01em;
    color: rgba(226, 236, 255, .52);
    transition: color .38s ease, text-shadow .38s ease;
  }

  .card .unit {
    font-size: 11px;
    letter-spacing: .42em;
    text-indent: .42em;
    color: rgba(170, 195, 235, .42);
    transition: color .38s ease;
  }

  .card .bar {
    width: 26px; height: 2px;
    border-radius: 2px;
    background: rgba(120, 180, 255, .25);
    transition: width .38s ease, background .38s ease, box-shadow .38s ease;
  }

  /* 当前聚焦卡片 */
  .card.active {
    background: linear-gradient(160deg, rgba(77, 157, 255, .34), rgba(139, 92, 246, .16));
    border-color: rgba(124, 182, 255, .78);
    box-shadow:
      0 0 0 1px rgba(124, 182, 255, .28),
      0 30px 70px -18px rgba(60, 140, 255, .85),
      0 0 80px -14px rgba(120, 80, 255, .55),
      inset 0 1px 0 rgba(255,255,255,.22);
    cursor: default;
  }
  .card.active .num {
    color: #ffffff;
    text-shadow: 0 0 26px rgba(130, 190, 255, .95);
  }
  .card.active .unit { color: rgba(206, 228, 255, .95); }
  .card.active .bar {
    width: 46px;
    background: rgba(150, 205, 255, .95);
    box-shadow: 0 0 14px rgba(120, 185, 255, .9);
  }

  /* ---------- 两侧渐隐 ---------- */
  .fade {
    position: absolute;
    top: 0; bottom: 0;
    width: 20%;
    pointer-events: none;
    z-index: 900;
  }
  .fade.left  { left: 0;  background: linear-gradient(90deg, #05070c 0%, rgba(5,7,12,.72) 40%, rgba(5,7,12,0) 100%); }
  .fade.right { right: 0; background: linear-gradient(270deg, #05070c 0%, rgba(5,7,12,.72) 40%, rgba(5,7,12,0) 100%); }

  /* ---------- HUD ---------- */
  .hud {
    position: fixed;
    left: 0; right: 0;
    text-align: center;
    pointer-events: none;
    z-index: 1000;
    font-size: 12px;
    letter-spacing: .18em;
    color: rgba(160, 185, 225, .55);
  }
  .hud-top { top: 34px; }
  .hud-top b {
    display: block;
    font-size: 13px;
    font-weight: 600;
    letter-spacing: .32em;
    text-indent: .32em;
    color: rgba(205, 225, 255, .9);
    margin-bottom: 8px;
  }

  .hud-bottom { bottom: 34px; }
  .counter {
    font-size: 13px;
    letter-spacing: .12em;
    color: rgba(190, 215, 255, .85);
    margin-bottom: 12px;
    font-variant-numeric: tabular-nums;
  }
  .counter .cur { font-size: 20px; font-weight: 700; color: #fff; }
  .counter .tot { opacity: .45; }
  .tips { display: flex; gap: 18px; justify-content: center; flex-wrap: wrap; }
  .tips span { display: inline-flex; align-items: center; gap: 6px; }
  .tips i {
    width: 5px; height: 5px; border-radius: 50%;
    background: rgba(110, 165, 255, .8);
    box-shadow: 0 0 8px rgba(110, 165, 255, .9);
    font-style: normal;
  }
</style>
</head>
<body>

  <div id="stage">
    <div class="spotlight"></div>
    <div class="axis"></div>
    <div id="wrap"></div>
    <div class="fade left"></div>
    <div class="fade right"></div>
  </div>

  <div class="hud hud-top">
    <b>机组</b>
     TURBINE · CENTER FOCUS
  </div>

  <div class="hud hud-bottom">
    <div class="counter">
      <span class="cur" id="cur">01</span>
      <span class="tot" id="tot">/ 24</span>
    </div>
    <div class="tips">
      <span><i></i>滚轮切换</span>
      <span><i></i>拖拽浏览</span>
      <span><i></i>点击节点</span>
    </div>
  </div>

<script>
(function () {
  'use strict';

  const stage  = document.getElementById('stage');
  const wrap   = document.getElementById('wrap');
  const curEl  = document.getElementById('cur');
  const totEl  = document.getElementById('tot');

  /* ============ 配置 ============ */
  const TOTAL = 24;                 // 数量（闭环总数）
  const GAP   = 200;                // 第一档基准间距（px）
  
  // 扩展非线性间距，让卡片能延伸得更远，顶到屏幕最边缘
  const POS = [0, 210, 390, 550, 690, 810, 920, 1020, 1110]; 

  let current = 0;    
  let target  = 0;    
  let lastIdx = -1;
  let viewScale = 1;

  // 动态计算曲线参数
  let BASE_Y = 0;           // 中心卡片在 33.33% 处，本身不偏移
  let CURVE_FACTOR = 0;     // 抛物线系数

  const cards = [];

  /* ============ 创建卡片 ============ */
  for (let i = 0; i < TOTAL; i++) {
    const el = document.createElement('div');
    el.className = 'card';
    el.dataset.index = i;
    el.innerHTML =
      '<div class="num">' + String(i + 1).padStart(2, '0') + '</div>' +
      '<div class="bar"></div>' +
      '<div class="unit">机组</div>';
    wrap.appendChild(el);
    cards.push(el);
  }
  totEl.textContent = '/ ' + TOTAL;

  /* ============ 工具函数 ============ */
  const clamp = (v, a, b) => v < a ? a : (v > b ? b : v);

  function wrapOff(d) {
    const half = TOTAL / 2;
    d = d % TOTAL;
    if (d < -half) d += TOTAL;
    else if (d >= half) d -= TOTAL;
    return d;
  }

  function posFor(off) {
    const a = Math.abs(off);
    const sgn = off < 0 ? -1 : 1;
    const last = POS.length - 1;
    if (a >= last) return sgn * (POS[last] + (a - last) * 85);
    const i = Math.floor(a);
    const f = a - i;
    return sgn * (POS[i] + (POS[i + 1] - POS[i]) * f);
  }

  /* ============ 核心渲染 ============ */
  function render() {
    for (let i = 0; i < TOTAL; i++) {
      const el = cards[i];
      const off = wrapOff(i - current);
      const a = Math.abs(off);

      // 增加隐藏阈值，让更多边缘卡片显示（直到顶角）
      if (a > 5.5) {
        if (el.style.opacity !== '0') {
          el.style.opacity = '0';
          el.style.pointerEvents = 'none';
        }
        continue;
      }

      // 1. X 轴（水平非线性展开）
      const x = posFor(off) * viewScale;
      
      // 2. Y 轴（动态抛物线）
      // 屏幕中心为基准，中心卡片在此处 y = 0。
      // 随着 x 变大，y 呈抛物线向上（负值）。
      const y = BASE_Y + CURVE_FACTOR * Math.pow(x, 2);

      // 缩小比例：中心 1.3 倍，向外递减
      const scale = 1.3 / (1 + a * 0.6);
      
      // 透明度：越往两侧越淡
      const opacity = Math.max(0, 1 - a * 0.18);
      
      // 模糊度
      const blur = a > 0.08 ? Math.min(a * 0.9, 4) : 0;

      el.style.transform =
        'translate(-50%,-50%) translate(' + x.toFixed(2) + 'px,' + y.toFixed(2) + 'px) scale(' + scale.toFixed(4) + ')';
      el.style.opacity = opacity.toFixed(3);
      el.style.filter = blur > 0.1 ? 'blur(' + blur.toFixed(2) + 'px)' : 'none';
      el.style.zIndex = String(600 - Math.round(a * 20));
      el.style.pointerEvents = a < 2.8 ? 'auto' : 'none';

      el.classList.toggle('active', a < 0.5);
    }

    const idx = ((Math.round(current) % TOTAL) + TOTAL) % TOTAL;
    if (idx !== lastIdx) {
      lastIdx = idx;
      curEl.textContent = String(idx + 1).padStart(2, '0');
    }
  }

  /* ============ 动画主循环 ============ */
  let dragging = false;

  function loop() {
    if (!dragging) {
      current += (target - current) * 0.14;
      if (Math.abs(target - current) < 0.0008) current = target;
    }
    render();
    requestAnimationFrame(loop);
  }

  /* ============ 滚轮与交互 ============ */
  let wheelLock = 0;
  stage.addEventListener('wheel', function (e) {
    e.preventDefault();
    const now = performance.now();
    if (now - wheelLock < 130) return;
    wheelLock = now;
    const dir = e.deltaY > 0 ? 1 : -1;
    target = Math.round(target) + dir;
  }, { passive: false });

  let startX = 0, lastX = 0, movedDist = 0, pressedIndex = -1, hasDragged = false;

  stage.addEventListener('pointerdown', function (e) {
    if (e.button !== undefined && e.button !== 0) return;
    dragging = true;
    hasDragged = false;
    startX = lastX = e.clientX;
    movedDist = 0;
    pressedIndex = -1;

    const card = e.target.closest ? e.target.closest('.card') : null;
    if (card) pressedIndex = Number(card.dataset.index);

    stage.classList.add('dragging');
    try { stage.setPointerCapture(e.pointerId); } catch (_) {}
  });

  stage.addEventListener('pointermove', function (e) {
    if (!dragging) return;
    const dx = e.clientX - lastX;
    lastX = e.clientX;
    movedDist += Math.abs(dx);

    if (!hasDragged && movedDist > 4) {
      hasDragged = true;
      target = current;
    }

    if (hasDragged) {
      const unit = GAP * viewScale;
      current -= dx / unit;
      target = current;
    }
  });

  function endDrag(e) {
    if (!dragging) return;
    dragging = false;
    stage.classList.remove('dragging');
    try { stage.releasePointerCapture(e.pointerId); } catch (_) {}

    if (hasDragged) {
      target = Math.round(current);
    } else if (pressedIndex >= 0) {
      const base = Math.round(current);
      target = base + wrapOff(pressedIndex - base);
    }
  }

  stage.addEventListener('pointerup', endDrag);
  stage.addEventListener('pointercancel', endDrag);

  window.addEventListener('keydown', function (e) {
    if (e.key === 'ArrowRight') target = Math.round(target) + 1;
    if (e.key === 'ArrowLeft')  target = Math.round(target) - 1;
  });

  /* ============ 动态屏幕适配（核心） ============ */
  function resize() {
    const W = window.innerWidth;
    const H = window.innerHeight;
    
    // 缩放整体尺寸以适应小屏幕（基准宽度 1400）
    viewScale = clamp(W / 1400, 0.45, 1.2);
    wrap.style.transform = 'scale(' + viewScale + ')';

    // ---- 动态抛物线计算 ----
    // 目标：中心卡片在 1/3 处（本身不偏移），左右两边在 X 接近 W/2 时，Y 接近 -H/3 (即顶到天灵盖)
    // 取屏幕边缘的目标坐标
    const targetX = (W / 2) * 0.9;  // X 接近屏幕最边缘
    const targetY = -H * 0.36;      // Y 向上偏移到顶部边缘
    
    // y = curveFactor * x^2  =>  curveFactor = y / x^2
    CURVE_FACTOR = targetY / Math.pow(targetX, 2);
    
    // 中心点不再需要额外偏移，因为已经在 CSS 中通过 top: 33.33% 定位了
    BASE_Y = 0; 
  }
  window.addEventListener('resize', resize);

  /* ============ 启动 ============ */
  resize();
  current = 0;
  target = 0;
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
